name: 🤖 Daily Remote Job Search & Tailored CV Briefing

on:
  schedule:
    # 03:00 UTC = 09:00 AM Bangladesh Standard Time (BST), Mon-Fri
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-daily-job-search:
    name: Aggregate, Tailor Resumes & Notify WhatsApp
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📄 Install LaTeX (for ATS Vector Resume PDF Generation)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          pdflatex --version

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run AI Job Search Pipeline
        run: |
          python core_orchestrator.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
          USER_PROFILE_JSON: ${{ secrets.USER_PROFILE_JSON }}
